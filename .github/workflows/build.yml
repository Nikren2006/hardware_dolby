name: Build MI Sound APK & Magisk Module

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for release (optional)'
        required: false
        default: 'auto-build'
      release_title:
        description: 'Title for release'
        required: false
        default: 'MI Sound Module - Manual Build'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -L -o $HOME/android-sdk/cmdline-tools/tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q $HOME/android-sdk/cmdline-tools/tools.zip -d $HOME/android-sdk/cmdline-tools/
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          rm -f $HOME/android-sdk/cmdline-tools/tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install build-tools and platform
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE }}" | base64 -d > release.keystore

      - name: Build release APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.2'
          arguments: :app:assembleRelease
          working-directory: LunarisDolby
          env:
            SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
            SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
            SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
            SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Ensure assets directory exists
        run: mkdir -p assets/libs

      - name: Copy APK for module packaging
        run: cp LunarisDolby/app/build/outputs/apk/release/app-release.apk assets/MiSound.apk

      - name: Download Dolby hardware libraries
        run: |
          curl -L -o assets/libs/libdlbalm.so "https://github.com/Pong-Development/hardware_dolby/raw/main/vendor/lib64/soundfx/libdlbalm.so"
          curl -L -o assets/libs/libswdap.so "https://github.com/Pong-Development/hardware_dolby/raw/main/vendor/lib64/soundfx/libswdap.so"
          curl -L -o assets/libs/libswgamedap.so "https://github.com/Pong-Development/hardware_dolby/raw/main/vendor/lib64/soundfx/libswgamedap.so"
          curl -L -o assets/libs/libswvqe.so "https://github.com/Pong-Development/hardware_dolby/raw/main/vendor/lib64/soundfx/libswvqe.so"

      - name: Make build script executable
        run: chmod +x build_module.sh

      - name: Build Magisk module
        run: ./build_module.sh

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: misound-module
          path: misound-module.zip

      - name: Create Release
        if: ${{ inputs.release_tag != '' }}
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag || 'auto-build' }}
          release_name: ${{ inputs.release_title || 'MI Sound Module - Manual Build' }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: ${{ inputs.release_tag != '' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./misound-module.zip
          asset_name: misound-module.zip
          asset_content_type: application/zip