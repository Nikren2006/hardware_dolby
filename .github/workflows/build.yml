name: Build MI Sound APK & Magisk Module

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for release (optional)'
        required: false
        default: 'auto-build'
      release_title:
        description: 'Title for release'
        required: false
        default: 'MI Sound Module - Manual Build'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -L -o /tmp/tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools/"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/" 2>/dev/null || true
          rm -f /tmp/tools.zip
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install build-tools and platform
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Install Gradle 8.2
        run: |
          curl -L -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /opt/
          ln -s /opt/gradle-8.2/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE }}" | base64 -d > release.keystore

      - name: Build release APK
        working-directory: LunarisDolby
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Ensure assets directory exists
        run: mkdir -p assets/libs

      - name: Copy APK for module packaging
        run: cp LunarisDolby/app/build/outputs/apk/release/app-release.apk assets/MiSound.apk

      - name: Download Dolby hardware libraries
        run: |
          curl -L -o assets/libs/libdlbalm.so "https://github.com/Pong-Development/hardware_dolby/raw/main/vendor/lib64/soundfx/libdlbalm.so"
          curl -L -o assets/libs/libswdap.so "https://github.com/Pong-Development/hardware_dolby/raw/main/vendor/lib64/soundfx/libswdap.so"
          curl -L -o assets/libs/libswgamedap.so "https://github.com/Pong-Development/hardware_dolby/raw/main/vendor/lib64/soundfx/libswgamedap.so"
          curl -L -o assets/libs/libswvqe.so "https://github.com/Pong-Development/hardware_dolby/raw/main/vendor/lib64/soundfx/libswvqe.so"

      - name: Make build script executable
        run: chmod +x build_module.sh

      - name: Build Magisk module
        run: ./build_module.sh

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: misound-module
          path: misound-module.zip

      - name: Create Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.release_title }}" \
            --notes "Automated build from GitHub Actions"

      - name: Upload Release Asset
        if: ${{ inputs.release_tag != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            ./misound-module.zip \
            --clobber
